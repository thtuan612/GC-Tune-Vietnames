
name: Build GC Tune Vietnamese

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.java"
      - "AndroidManifest.xml"
      - "res/**"
      - "gctune-vi.patch"
      - "build.ps1"
      - ".github/workflows/build-vietnamese.yml"

permissions:
  contents: read

concurrency:
  group: build-vietnamese-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Patch, build and sign APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Apply Vietnamese patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check gctune-vi.patch
          git apply gctune-vi.patch
          git diff --check

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.GCTUNE_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.GCTUNE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.GCTUNE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS_PATH="${RUNNER_TEMP}/release.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Dang dung keystore co dinh tu GitHub Secret (GCTUNE_KEYSTORE_BASE64)."
            echo "${KEYSTORE_BASE64}" | base64 -d > "${KS_PATH}"
            echo "KEYSTORE_PATH=${KS_PATH}" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${KS_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KS_ALIAS:-gctune}" >> "$GITHUB_ENV"
          else
            echo "::warning::Chua thiet lap secret GCTUNE_KEYSTORE_BASE64 - dang dung key TEST tam thoi. APK se doi chu ky moi lan build va khong the cai de (update) len ban da cai truoc do. Xem huong dan trong README de tao key co dinh."
            keytool -genkeypair \
              -keystore "${KS_PATH}" \
              -storepass android \
              -keypass android \
              -alias gctune \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=GC Tune Test, OU=CI, O=GC Tune, C=VN"
            echo "KEYSTORE_PATH=${KS_PATH}" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=gctune" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME}"
          BT="${SDK}/build-tools/34.0.0"
          ANDROID_JAR="${SDK}/platforms/android-35/android.jar"
          OUT="${GITHUB_WORKSPACE}/build-output"
          CLASSES="${OUT}/classes"
          DEX="${OUT}/dex"

          test -f "${ANDROID_JAR}"
          test -x "${BT}/aapt"
          test -x "${BT}/d8"
          test -x "${BT}/zipalign"
          test -x "${BT}/apksigner"

          rm -rf "${OUT}"
          mkdir -p "${CLASSES}" "${DEX}"

          mapfile -t SOURCES < <(
            find . -maxdepth 1 -type f -name '*.java' -print
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "ERROR: No Java source files found at repository root."
            exit 1
          fi

          javac \
            -source 8 \
            -target 8 \
            -encoding UTF-8 \
            -bootclasspath "${ANDROID_JAR}" \
            -classpath "${ANDROID_JAR}" \
            -d "${CLASSES}" \
            "${SOURCES[@]}"

          test -f "${CLASSES}/com/poc/gctune/Main.class"
          test -f "${CLASSES}/com/poc/gctune/PrefsActivity.class"
          test -f "${CLASSES}/com/poc/gctune/SetupActivity.class"

          jar cf "${OUT}/classes.jar" -C "${CLASSES}" .

          "${BT}/d8" \
            --release \
            --lib "${ANDROID_JAR}" \
            --output "${DEX}" \
            "${OUT}/classes.jar"

          test -s "${DEX}/classes.dex"

          "${BT}/aapt" package \
            -f \
            -M "${GITHUB_WORKSPACE}/AndroidManifest.xml" \
            -S "${GITHUB_WORKSPACE}/res" \
            -I "${ANDROID_JAR}" \
            -F "${OUT}/unsigned.apk"

          cp "${DEX}/classes.dex" "${OUT}/classes.dex"

          (
            cd "${OUT}"
            "${BT}/aapt" add unsigned.apk classes.dex
          )

          "${BT}/zipalign" \
            -f 4 \
            "${OUT}/unsigned.apk" \
            "${OUT}/aligned.apk"

          "${BT}/apksigner" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEYSTORE_PASSWORD}" \
            --out "${OUT}/gctune-vietnamese.apk" \
            "${OUT}/aligned.apk"

          "${BT}/apksigner" verify \
            --verbose \
            "${OUT}/gctune-vietnamese.apk"

          test -s "${OUT}/gctune-vietnamese.apk"
          echo "APK build and signature verification completed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GC-Tune-Vietnamese-APK
          path: build-output/gctune-vietnamese.apk
          if-no-files-found: error
          retention-days: 14
