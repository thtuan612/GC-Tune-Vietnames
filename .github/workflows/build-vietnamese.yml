name: GC Tune Vietnamese

on:
  workflow_dispatch:
  push:
    paths:
      - 'gctune-vi.patch'
      - '.github/workflows/build-vietnamese.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Apply Vietnamese patch
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gctune-vi.patch ]; then
            echo "ERROR: gctune-vi.patch not found in repository root"
            exit 1
          fi

          git apply --check gctune-vi.patch
          git apply gctune-vi.patch

          echo "Patch applied successfully."
          git diff --stat

      - name: Compile Java sources
        shell: bash
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/34.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/gctune-build"

          mkdir -p "$WORK/classes" "$WORK/dex"

          mapfile -t JAVA_FILES < <(
            find . -maxdepth 1 -type f -name '*.java' -print
          )

          if [ "${#JAVA_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No Java files found in repository root."
            exit 1
          fi

          javac \
            -source 8 \
            -target 8 \
            -nowarn \
            -encoding UTF-8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR" \
            -d "$WORK/classes" \
            "${JAVA_FILES[@]}"

          test -f "$WORK/classes/com/poc/gctune/Main.class"
          test -f "$WORK/classes/com/poc/gctune/SetupActivity.class"

          jar cf "$WORK/classes.jar" -C "$WORK/classes" .

          "$BT/d8" \
            --release \
            --lib "$ANDROID_JAR" \
            --output "$WORK/dex" \
            "$WORK/classes.jar"

          test -f "$WORK/dex/classes.dex"

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/34.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/gctune-build"

          "$BT/aapt" package \
            -f \
            -M AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -F "$WORK/gctune-unsigned.apk"

          (
            cd "$WORK/dex"
            "$BT/aapt" add "$WORK/gctune-unsigned.apk" classes.dex
          )

          "$BT/zipalign" -f 4 \
            "$WORK/gctune-unsigned.apk" \
            "$WORK/gctune-aligned.apk"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/34.0.0"
          WORK="$RUNNER_TEMP/gctune-build"
          KEYSTORE="$RUNNER_TEMP/gctune.keystore"
          APK="$RUNNER_TEMP/gctune-vietnamese.apk"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias gd \
            -dname "CN=GC Tune Vietnamese" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -noprompt

          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias gd \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$APK" \
            "$WORK/gctune-aligned.apk"

          "$BT/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GC-Tune-Vietnamese-APK
          path: ${{ runner.temp }}/gctune-vietnamese.apk
          if-no-files-found: error
          retention-days: 7
          
