
name: Build GC Tune Vietnamese

on:
  workflow_dispatch:
  push:
    paths:
      - "gctune-vi.patch"
      - ".github/workflows/build-vietnamese.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Apply Vietnamese patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check gctune-vi.patch
          git apply gctune-vi.patch
